<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GreenWorld — Live Neighbourhood Energy</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#0f1720; --card:#17212b; --ink:#e7eef5; --muted:#8aa0b2;
          --cons:#ff6b6b; --gen:#51cf66; --net:#4dabf7; --line:#243444; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--ink); padding:24px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin-bottom:20px; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .kpi .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .kpi .val { font-size:26px; font-weight:650; margin-top:4px; }
  .val.cons{color:var(--cons)} .val.gen{color:var(--gen)} .val.net{color:var(--net)}
  .chart-wrap { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:20px; height:340px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; background:#22303c; color:var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .controls { display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .controls button { background:#22303c; color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px; }
  .controls button:hover { background:#2b3c4a; }
  .ctl-label { color:var(--muted); font-size:12px; margin-left:8px; }
  .controls button.active { background:#2f6fed; border-color:#2f6fed; color:#fff; }
</style>
</head>
<body>
  <h1>GreenWorld — Live Neighbourhood Energy</h1>
  <div class="sub" id="meta">Connecting…</div>

  <div class="controls">
    <button id="btn-pause">Pause</button>
    <button id="btn-resume">Resume</button>
    <span class="ctl-label">Speed:</span>
    <button data-delay="2000">0.5×</button>
    <button data-delay="1000">1×</button>
    <button data-delay="250">4×</button>
    <button data-delay="50">20×</button>
    <span class="pill" id="ctl-status">—</span>
  </div>

  <div class="grid">
    <div class="card kpi"><div class="label">Simulated time</div><div class="val" id="k-time">—</div></div>
    <div class="card kpi"><div class="label">Season</div><div class="val" id="k-season">—</div></div>
    <div class="card kpi"><div class="label">Weather</div><div class="val" id="k-weather" style="font-size:18px">—</div></div>
    <div class="card kpi"><div class="label">Consumption</div><div class="val cons" id="k-cons">—</div></div>
    <div class="card kpi"><div class="label">Generation</div><div class="val gen" id="k-gen">—</div></div>
    <div class="card kpi"><div class="label">Net</div><div class="val net" id="k-net">—</div></div>
    <div class="card kpi"><div class="label">Cumulative consumed</div><div class="val" id="k-cc">—</div></div>
    <div class="card kpi"><div class="label">Cumulative generated</div><div class="val" id="k-cg">—</div></div>
  </div>

  <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
    <span class="ctl-label" style="margin:0">Chart window:</span>
    <div class="controls" id="range-controls" style="margin:0">
      <button data-last="6">Now (6h)</button>
      <button data-last="24" class="active">Last 24h</button>
      <button data-last="168">7 days</button>
      <button data-last="0">All</button>
    </div>
  </div>
  <div class="chart-wrap"><canvas id="chart"></canvas></div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <strong>Meters — cumulative energy per asset</strong>
      <span class="pill" id="meter-count"></span>
    </div>
    <table>
      <thead><tr><th>Asset</th><th>Kind</th><th>Dir</th>
        <th class="num">Consumed kWh</th><th class="num">Generated kWh</th><th>Last reading</th></tr></thead>
      <tbody id="meters"></tbody>
    </table>
  </div>

<script>
const fmt = (n, d=2) => (n ?? 0).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const timeFmt = t => t ? new Date(t).toLocaleString() : "—";

const ctx = document.getElementById('chart');
const chart = new Chart(ctx, {
  type: 'line',
  data: { labels: [], datasets: [
    { label:'Consumption kW', data:[], borderColor:'#ff6b6b', backgroundColor:'transparent', tension:.25, pointRadius:0 },
    { label:'Generation kW',  data:[], borderColor:'#51cf66', backgroundColor:'transparent', tension:.25, pointRadius:0 },
    { label:'Net kW',         data:[], borderColor:'#4dabf7', backgroundColor:'transparent', tension:.25, pointRadius:0, borderDash:[4,3] },
  ]},
  options: { responsive:true, maintainAspectRatio:false, animation:false,
    scales:{ x:{ ticks:{color:'#8aa0b2',maxTicksLimit:8}, grid:{color:'#243444'} },
             y:{ ticks:{color:'#8aa0b2'}, grid:{color:'#243444'} } },
    plugins:{ legend:{ labels:{ color:'#e7eef5' } } } }
});

async function j(url){ const r = await fetch(url); if(!r.ok) throw new Error(url+' '+r.status); return r.json(); }

// Chart window in simulated hours (step is 1h, so last=N ⇒ N simulated hours). 0 = all.
let historyLast = 24;
document.querySelectorAll('#range-controls button').forEach(b => b.onclick = () => {
  historyLast = parseInt(b.dataset.last, 10);
  document.querySelectorAll('#range-controls button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  tick();
});

async function tick(){
  try {
    const histUrl = historyLast > 0
      ? `/api/neighbourhood/aggregate/history?last=${historyLast}`
      : `/api/neighbourhood/aggregate/history`;
    const [nb, agg, hist, meters] = await Promise.all([
      j('/api/neighbourhood'), j('/api/neighbourhood/aggregate'),
      j(histUrl), j('/api/neighbourhood/meters')
    ]);

    document.getElementById('meta').textContent =
      `${nb.name} · ${nb.householdCount} households · ${nb.publicFacilityCount} public facilities · start ${timeFmt(nb.simulationStart)}`;
    document.getElementById('k-time').textContent = timeFmt(agg.at);
    document.getElementById('k-season').textContent = agg.season ?? '—';
    document.getElementById('k-weather').textContent =
      `${fmt(agg.temperatureCelsius,1)}°C · cloud ${Math.round(agg.cloudCover*100)}% · sun ${Math.round(agg.irradianceFactor*100)}%`;
    document.getElementById('k-cons').textContent = fmt(agg.totalConsumptionKw)+' kW';
    document.getElementById('k-gen').textContent  = fmt(agg.totalGenerationKw)+' kW';
    document.getElementById('k-net').textContent  = fmt(agg.netKw)+' kW';
    document.getElementById('k-cc').textContent   = fmt(agg.cumulativeConsumedKwh,1)+' kWh';
    document.getElementById('k-cg').textContent   = fmt(agg.cumulativeGeneratedKwh,1)+' kWh';

    chart.data.labels = hist.points.map(p => new Date(p.at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit'}));
    chart.data.datasets[0].data = hist.points.map(p => p.totalConsumptionKw);
    chart.data.datasets[1].data = hist.points.map(p => p.totalGenerationKw);
    chart.data.datasets[2].data = hist.points.map(p => p.netKw);
    chart.update();

    document.getElementById('meter-count').textContent =
      `${meters.meters.length} meters · Σ ${fmt(meters.totalConsumedKwh,1)} consumed / ${fmt(meters.totalGeneratedKwh,1)} generated kWh`;
    const rows = [...meters.meters]
      .sort((a,b)=> (b.cumulativeConsumedKwh+b.cumulativeGeneratedKwh)-(a.cumulativeConsumedKwh+a.cumulativeGeneratedKwh))
      .map(m => `<tr><td>${m.assetName}</td><td>${m.kind}</td><td>${m.direction}</td>
        <td class="num">${fmt(m.cumulativeConsumedKwh)}</td>
        <td class="num">${fmt(m.cumulativeGeneratedKwh)}</td>
        <td>${timeFmt(m.lastReadingAt)}</td></tr>`).join('');
    document.getElementById('meters').innerHTML = rows;
  } catch(e){ document.getElementById('meta').textContent = 'Waiting for simulator… ('+e.message+')'; }
}
// ---- clock controls ----
async function post(url){ try { const r = await fetch(url,{method:'POST'}); return r.ok ? r.json() : null; } catch { return null; } }
function renderStatus(s){ if(!s) return;
  document.getElementById('ctl-status').textContent = (s.isPaused ? 'Paused' : 'Running') + ` · ${s.stepDelayMs}ms/tick`; }
document.getElementById('btn-pause').onclick  = async () => renderStatus(await post('/api/simulation/pause'));
document.getElementById('btn-resume').onclick = async () => renderStatus(await post('/api/simulation/resume'));
document.querySelectorAll('button[data-delay]').forEach(b =>
  b.onclick = async () => renderStatus(await post('/api/simulation/speed?delayMs='+b.dataset.delay)));
async function pollStatus(){ try { renderStatus(await (await fetch('/api/simulation/status')).json()); } catch {} }

tick(); setInterval(tick, 2000);
pollStatus(); setInterval(pollStatus, 3000);
</script>
</body>
</html>
