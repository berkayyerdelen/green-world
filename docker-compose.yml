services:
  postgres:
    image: postgres:16
    container_name: greenworld-postgres
    environment:
      POSTGRES_DB: greenworld
      POSTGRES_USER: greenworld
      POSTGRES_PASSWORD: greenworld
    ports:
      - "5432:5432"
    volumes:
      - greenworld-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenworld"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: greenworld-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  greenworld-pgdata:
